name: Build signed desktop releases

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            artifact: windows
          - name: macOS
            runner: macos-15
            artifact: macos
          - name: Linux x64
            runner: ubuntu-24.04
            artifact: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-tk
      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        run: brew install portaudio
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Build app and platform installer
        shell: bash
        env:
          LAYA_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python packaging/build_release.py "$LAYA_RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign manifest and publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create and sign update manifest
        env:
          LAYA_UPDATE_SIGNING_KEY_B64: ${{ secrets.LAYA_UPDATE_SIGNING_KEY_B64 }}
          LAYA_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install cryptography
          python packaging/create_update_manifest.py "$LAYA_RELEASE_TAG" dist
      - name: Publish signed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: LAYA Agentic Studio ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
